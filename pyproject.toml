[project]
name = "enterprise-skill-hub"
version = "1.1.0"
description = "Local enterprise Skill registry, Web app and authenticated MCP server"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0", "fastapi==0.146.0", "uvicorn==0.54.0",
  "argon2-cffi==25.1.0", "PyJWT==2.15.1", "filelock==4.2.3",
  "PyYAML==6.0.3", "python-multipart==0.0.32", "packaging>=24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
